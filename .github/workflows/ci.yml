name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy strict)
        run: mypy testkit/

      - name: Tests with coverage gate (85%)
        # `-p no:testkit` stops the pytest11 entry point from importing the
        # plugin at startup (before coverage starts), which would otherwise
        # mark the plugin's import-time code as uncovered and fail the gate.
        # The plugin's own behavior is verified in the dedicated step below.
        run: pytest -n auto tests/ --cov=testkit --cov-fail-under=85 -p no:testkit --ignore=tests/test_plugin.py

      - name: Plugin auto-registration tests
        # Run separately (serial, no coverage) — these exercise the pytest11
        # entry point directly via pytester.
        run: pytest tests/test_plugin.py
