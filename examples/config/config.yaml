# =====================================================================
# 多环境配置示例(config/config.yaml)
# 结构:default(基线) + default_env + envs(各环境覆盖段)
# 合并顺序:default → 指定环境段 → 环境变量覆盖(ATF_ 前缀)
# 环境选择:显式入参 > 环境变量 ATF_ENV > default_env > envs 第一个
# =====================================================================

default:
  http:
    timeout: 10.0
    max_retries: 2
    retry_backoff: 0.5
    verify_ssl: true
    extra_headers:
      X-From: atf
  ssh:
    username: root
    port: 22
    timeout: 10.0
  pool:
    lock_timeout: 30
  guard:
    wait_ready_timeout: 600 # 共享 fixture 等待创建完成的超时
    takeover_after: 300     # creating 停留超过该秒数触发接管

default_env: dev

envs:
  dev:
    http:
      base_url: https://dev-api.example.com
      auth:
        type: token
        token: dev-token-please-change
        header: Authorization
        scheme: Bearer
    ssh:
      host: 192.168.1.10
      password: dev-password-please-change
    pool:
      path: config/resource_pool.yaml

  qa:
    http:
      base_url: https://qa-api.example.com
      auth:
        type: apikey
        key: qa-apikey-please-change
        header: X-API-Key
    ssh:
      host: 192.168.2.10
      key_file: ~/.ssh/id_ed25519
    pool:
      path: config/resource_pool.yaml

  prod:
    http:
      base_url: https://api.example.com
      auth:
        type: cookie
        cookies:
          sid: prod-session-please-change
      verify_ssl: true
    ssh:
      host: 10.0.0.10
      key_file: ~/.ssh/id_ed25519
    pool:
      path: config/resource_pool_prod.yaml
