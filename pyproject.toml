[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atf"
version = "0.1.0"
description = "通用 REST API + SSH 自动化测试框架(零业务耦合,模块可独立使用)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pytest>=7.0",
    "pytest-xdist>=3.0",
    "requests>=2.28",
    "paramiko>=3.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "filelock>=3.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "sut: 需要真实被测环境(REST API / SSH)的示例用例",
]
