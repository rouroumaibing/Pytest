[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testkit"
version = "0.1.0"
description = "A generic, business-agnostic Python test framework for systems with a REST API management plane and an SSH node plane."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "paramiko>=3.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "filelock>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-xdist>=3.3",
]

[tool.setuptools.packages.find]
include = ["testkit*"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-ra --basetemp=.pytest_tmp"
